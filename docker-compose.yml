services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whoowns
      POSTGRES_USER: whoowns
      POSTGRES_PASSWORD: whoowns
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoowns -d whoowns"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://whoowns:whoowns@db:5432/whoowns
      WHOOWNS_API_KEYS: dev-api-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
